name: Pipeline de Testes (CI)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Como seu main.py tenta conectar no Redis local antes de ir para o fakeredis,
      # você pode subir um Redis real no próprio container do GitHub Actions!
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Ou a versão que você estiver usando

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn redis fakeredis pytest httpx

    - name: Executar suíte de testes com Pytest
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        pytest